<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t">
  <title id="t">Apple MacBook Pro 14-inch laptop in space black (illustration)</title>
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3c41"/>
      <stop offset=".5" stop-color="#2a2c30"/>
      <stop offset="1" stop-color="#1f2023"/>
    </linearGradient>
    <linearGradient id="lidEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55585e"/>
      <stop offset=".5" stop-color="#3b3d42"/>
      <stop offset="1" stop-color="#55585e"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d53"/>
      <stop offset=".35" stop-color="#34363b"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </linearGradient>
    <linearGradient id="deckTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c2e32"/>
      <stop offset=".5" stop-color="#45484e"/>
      <stop offset="1" stop-color="#2c2e32"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120c33"/>
      <stop offset=".55" stop-color="#2a1260"/>
      <stop offset="1" stop-color="#0a1a4a"/>
    </linearGradient>
    <radialGradient id="b1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#7a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2ec5ff"/><stop offset="1" stop-color="#2ec5ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
      <stop offset=".46" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="screen"><rect x="171" y="49" width="458" height="290" rx="7"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="400" cy="440" rx="360" ry="26" fill="url(#shadow)"/>

  <!-- lid -->
  <rect x="152" y="28" width="496" height="334" rx="20" fill="url(#lidEdge)"/>
  <rect x="155" y="31" width="490" height="328" rx="18" fill="url(#lid)"/>
  <rect x="161" y="38" width="478" height="314" rx="13" fill="#060607"/>

  <!-- display -->
  <g clip-path="url(#screen)">
    <rect x="171" y="49" width="458" height="290" fill="url(#wall)"/>
    <g filter="url(#soft)">
      <ellipse cx="260" cy="270" rx="170" ry="90" fill="url(#b1)" transform="rotate(-18 260 270)"/>
      <ellipse cx="420" cy="210" rx="190" ry="80" fill="url(#b2)" transform="rotate(-24 420 210)"/>
      <ellipse cx="540" cy="140" rx="160" ry="70" fill="url(#b3)" transform="rotate(-30 540 140)"/>
      <ellipse cx="600" cy="300" rx="150" ry="60" fill="url(#b4)" transform="rotate(-15 600 300)"/>
    </g>
    <path d="M171 300 C 300 230, 420 260, 629 150 L629 339 L171 339 Z" fill="#ffffff" opacity=".06"/>
    <!-- menu bar and dock hint -->
    <rect x="171" y="49" width="458" height="11" fill="#000" opacity=".25"/>
    <rect x="300" y="318" width="200" height="14" rx="5" fill="#fff" opacity=".18"/>
    <g fill="#fff" opacity=".55">
      <rect x="310" y="321" width="8" height="8" rx="2"/><rect x="324" y="321" width="8" height="8" rx="2"/>
      <rect x="338" y="321" width="8" height="8" rx="2"/><rect x="352" y="321" width="8" height="8" rx="2"/>
      <rect x="366" y="321" width="8" height="8" rx="2"/><rect x="380" y="321" width="8" height="8" rx="2"/>
      <rect x="394" y="321" width="8" height="8" rx="2"/><rect x="408" y="321" width="8" height="8" rx="2"/>
      <rect x="422" y="321" width="8" height="8" rx="2"/><rect x="436" y="321" width="8" height="8" rx="2"/>
      <rect x="450" y="321" width="8" height="8" rx="2"/><rect x="464" y="321" width="8" height="8" rx="2"/>
      <rect x="478" y="321" width="8" height="8" rx="2"/>
    </g>
  </g>
  <!-- notch with camera -->
  <path d="M368 49 h64 v7 a5 5 0 0 1 -5 5 h-54 a5 5 0 0 1 -5 -5 z" fill="#060607"/>
  <circle cx="400" cy="54" r="2.2" fill="#1d2a3a"/>
  <!-- glass glare -->
  <rect x="161" y="38" width="478" height="314" rx="13" fill="url(#glare)"/>

  <!-- hinge -->
  <rect x="176" y="360" width="448" height="8" rx="3" fill="#121315"/>

  <!-- base / deck -->
  <path d="M104 368 H696 L748 404 Q750 410 742 412 H58 Q50 410 52 404 Z" fill="url(#deck)"/>
  <path d="M104 368 H696 L706 375 H94 Z" fill="url(#deckTop)" opacity=".8"/>
  <!-- front lip and thumb scoop -->
  <path d="M58 412 H742 Q738 420 726 421 H74 Q62 420 58 412 Z" fill="#141517"/>
  <path d="M362 412 Q400 422 438 412 Z" fill="#0c0c0d"/>
  <!-- edge highlight -->
  <path d="M104 368 H696" stroke="#6b6e74" stroke-width="1.2" opacity=".7"/>
</svg>

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#024731">
  <title>Activate your account · Joiner companion</title>
  <link rel="icon" href="/brand/logos/favicon.ico">
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: var(--lbg-grey-100); }
    .wrap { max-width: 430px; margin: 0 auto; min-height: 100dvh; background: var(--lbg-white); display: flex; flex-direction: column; }
    .hero { padding: var(--lbg-space-8) var(--lbg-space-6) var(--lbg-space-6); }
    .hero img { height: 40px; display: block; margin-bottom: var(--lbg-space-8); }
    .hero .eyebrow { font-family: var(--lbg-font-strong); font-weight: 700; font-size: var(--lbg-text-sm); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 var(--lbg-space-2); opacity: .9; }
    .hero h1 { margin-bottom: var(--lbg-space-2); }
    .hero p { margin: 0; opacity: .9; }
    main { padding: var(--lbg-space-6); flex: 1; }
    .facts { display: grid; gap: var(--lbg-space-2); margin: 0 0 var(--lbg-space-6); padding: var(--lbg-space-4); background: var(--lbg-grey-100); border-radius: var(--lbg-radius-lg); }
    .fact { display: flex; gap: var(--lbg-space-3); align-items: center; font-size: var(--lbg-text-sm); }
    .fact img { width: 20px; height: 20px; }
    .fact b { font-family: var(--lbg-font-strong); }
    form .lbg-btn { max-width: none; }
    .help { font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); margin: calc(-1 * var(--lbg-space-2)) 0 var(--lbg-space-4); }
    .problem h2 { font-size: var(--lbg-text-h3); line-height: var(--lbg-lh-h3); }
    .problem .lbg-btn { max-width: none; margin-top: var(--lbg-space-6); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="proto-strip">Concept prototype · synthetic data only</div>
  <div class="hero lbg-surface--pattern">
    <img src="/brand/logos/lbg-logo-white.svg" alt="Lloyds Banking Group">
    <p class="eyebrow">Your joiner companion</p>
    <h1 id="title">Welcome aboard</h1>
    <p id="lead">Checking your link…</p>
  </div>

  <main>
    <div id="setup" hidden>
      <div class="facts">
        <div class="fact"><img src="/brand/icons/job-type.svg" alt=""><span id="f-role"></span></div>
        <div class="fact"><img src="/brand/icons/location.svg" alt=""><span id="f-location"></span></div>
        <div class="fact" id="f-start-row"><img src="/brand/icons/calendar.svg" alt=""><span>Proposed start <b id="f-start"></b></span></div>
      </div>
      <form id="form" novalidate>
        <div class="field">
          <label for="email">Your login email</label>
          <input id="email" type="email" autocomplete="username" readonly>
        </div>
        <div class="field">
          <label for="password">Choose a password</label>
          <input id="password" type="password" autocomplete="new-password" required>
        </div>
        <p class="help" id="help"></p>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input id="confirm" type="password" autocomplete="new-password" required>
        </div>
        <p class="form-error" id="error" role="alert" hidden><img src="/brand/icons/form-exclamation.svg" alt=""><span></span></p>
        <button class="lbg-btn lbg-btn--primary" type="submit">Activate and sign in</button>
      </form>
    </div>

    <div class="problem" id="problem" hidden>
      <h2>We couldn't use this link</h2>
      <p id="problem-text"></p>
      <a class="lbg-btn lbg-btn--secondary" href="/login.html">Go to log in</a>
    </div>
  </main>
</div>

<script type="module">
  import { fmtDate } from '/js/chat.js';
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') ?? '';

  function showProblem(message) {
    $('title').textContent = 'Welcome aboard';
    $('lead').textContent = 'Your joiner companion app.';
    $('problem-text').textContent = message;
    $('problem').hidden = false;
    $('setup').hidden = true;
  }

  const res = await fetch(`/api/activate?token=${encodeURIComponent(token)}`);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    showProblem(data.error || "This link isn't valid.");
  } else {
    const i = data.invite;
    $('title').textContent = `Congratulations, ${i.name.split(' ')[0]}!`;
    $('lead').textContent = 'Set a password to open your joiner companion. It will guide you from now to your first 30 days.';
    $('f-role').textContent = i.jobTitle;
    $('f-location').textContent = i.location;
    if (i.startDate) $('f-start').textContent = fmtDate(i.startDate); else $('f-start-row').hidden = true;
    $('email').value = i.email;
    $('help').textContent = `At least ${i.minPassword} characters.`;
    $('setup').hidden = false;

    const form = $('form');
    const errorEl = $('error');
    const fail = (msg) => { errorEl.querySelector('span').textContent = msg; errorEl.hidden = false; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const password = $('password').value;
      if (password.length < i.minPassword) return fail(`Use at least ${i.minPassword} characters for your password`);
      if (password !== $('confirm').value) return fail("The two passwords don't match");
      const submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      try {
        const r = await fetch('/api/activate', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Something went wrong');
        location.replace(d.home);
      } catch (err) {
        fail(err.message);
        submit.disabled = false;
      }
    });
  }
</script>
</body>
</html>

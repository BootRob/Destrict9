<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece8e0">
  <title>Activate your account · Joiner companion</title>
  <link rel="icon" href="/brand/logos/favicon.ico">
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .help { font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); margin: calc(-1 * var(--lbg-space-2)) 0 var(--lbg-space-4); }
    .problem { padding: var(--lbg-space-6); border-radius: 22px; background: var(--lbg-white); box-shadow: var(--lbg-shadow-card); }
    .problem h2 { font-size: 22px; line-height: 1.2; margin: 0 0 var(--lbg-space-2); }
    .problem p { margin: 0; color: var(--lbg-grey-600); }
    .problem .lbg-btn { max-width: none; margin-top: var(--lbg-space-6); }
  </style>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/pass.css">
</head>
<body class="joiner">
<div class="entry">
  <div class="entry-top"><img class="logo" src="/brand/logos/lbg-logo.svg" alt="Lloyds Banking Group"></div>
  <div class="entry-hero">
    <p class="eyebrow">Your joiner companion</p>
    <h1 id="title">Welcome aboard</h1>
    <p class="lead" id="lead">Checking your link…</p>
    <div class="pass" id="pass" aria-label="Your joiner card" hidden>
      <img class="horse" src="/brand/logos/horse-white.svg" alt="">
      <div class="pass-top"><img src="/brand/logos/lbg-logo-white.svg" alt="Lloyds Banking Group"><span class="chip">Saddling up</span></div>
      <div class="pass-who">
        <div><div class="nm" id="pass-name"></div><div class="rl" id="pass-role"></div></div>
        <div class="no" id="pass-day" hidden>Day one<b id="pass-date"></b></div>
      </div>
    </div>
  </div>

  <main>
    <div id="setup" hidden>
      <form id="form" novalidate>
        <div class="field">
          <label for="email">Your login email</label>
          <input id="email" type="email" autocomplete="username" readonly>
        </div>
        <div class="field">
          <label for="password">Choose a password</label>
          <input id="password" type="password" autocomplete="new-password" required>
        </div>
        <p class="help" id="help"></p>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input id="confirm" type="password" autocomplete="new-password" required>
        </div>
        <p class="form-error" id="error" role="alert" hidden><img src="/brand/icons/form-exclamation.svg" alt=""><span></span></p>
        <button class="lbg-btn lbg-btn--primary" type="submit">Activate and sign in</button>
      </form>
    </div>

    <div class="problem" id="problem" hidden>
      <h2>We couldn't use this link</h2>
      <p id="problem-text"></p>
      <a class="lbg-btn lbg-btn--secondary" href="/login.html">Go to log in</a>
    </div>
  </main>
</div>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') ?? '';

  function showProblem(message) {
    $('title').textContent = 'Welcome aboard';
    $('lead').textContent = 'Your joiner companion app.';
    $('problem-text').textContent = message;
    $('problem').hidden = false;
    $('setup').hidden = true;
  }

  const res = await fetch(`/api/activate?token=${encodeURIComponent(token)}`);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    showProblem(data.error || "This link isn't valid.");
  } else {
    const i = data.invite;
    $('title').textContent = `Congratulations, ${i.name.split(' ')[0]}!`;
    $('lead').textContent = 'Your account is ready. Set a password to open your joiner companion: it guides you from now to your first 90 days.';
    // Their pass, with their name on it: the same card they'll see on the home screen.
    $('pass-name').textContent = i.name;
    $('pass-role').textContent = [i.jobTitle, i.location].filter(Boolean).join(' · ');
    if (i.startDate) {
      $('pass-date').textContent = new Date(`${i.startDate}T00:00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      $('pass-day').hidden = false;
    }
    $('pass').hidden = false;
    $('email').value = i.email;
    $('help').textContent = `At least ${i.minPassword} characters.`;
    $('setup').hidden = false;

    const form = $('form');
    const errorEl = $('error');
    const fail = (msg) => { errorEl.querySelector('span').textContent = msg; errorEl.hidden = false; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const password = $('password').value;
      if (password.length < i.minPassword) return fail(`Use at least ${i.minPassword} characters for your password`);
      if (password !== $('confirm').value) return fail("The two passwords don't match");
      const submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      try {
        const r = await fetch('/api/activate', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Something went wrong');
        location.replace(d.home === '/joiner/' ? '/joiner/welcome.html' : d.home); // welcome screen first (WS1)
      } catch (err) {
        fail(err.message);
        submit.disabled = false;
      }
    });
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ece8e0">
  <title>Your journey · Joiner companion</title>
  <link rel="icon" href="/brand/logos/favicon.ico">
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/journey.css">
  <link rel="stylesheet" href="/css/joiner.css">
  <style>
    .person { display: flex; align-items: center; gap: var(--lbg-space-3); margin-bottom: var(--lbg-space-3); padding: var(--lbg-space-4); }
    .person .info { flex: 1; min-width: 0; }
    .person .role { font-size: 12px; font-family: var(--lbg-font-strong); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--lbg-heritage-green); }
    .person strong { display: block; font-family: var(--lbg-font-strong); }
    .person .note { display: block; font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); }
    .person .lbg-btn { width: auto; min-width: 0; min-height: 44px; padding: 8px 16px; font-size: var(--lbg-text-md); flex: none; position: relative; }
    .person .unread { margin-left: var(--lbg-space-2); min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--lbg-radius-pill); background: var(--lbg-accent-green); color: var(--lbg-black); font-size: 12px; line-height: 20px; display: inline-block; text-align: center; }
    .person--quiet { box-shadow: none; border: 1px dashed var(--lbg-grey-400); }
    .task { display: flex; gap: var(--lbg-space-4); align-items: center; margin-bottom: var(--lbg-space-3); text-decoration: none; color: inherit; width: 100%; text-align: left; border: 0; cursor: pointer; font: inherit; }
    .task .icon { width: 44px; height: 44px; flex: none; border-radius: var(--lbg-radius-md); background: var(--lbg-grey-100); display: grid; place-items: center; }
    .task .icon img { width: 22px; height: 22px; }
    .task .icon--ai { background: var(--lbg-charcoal); color: var(--lbg-white); font-family: var(--lbg-font-strong); font-weight: 700; font-size: 13px; }
    .task .body { flex: 1; min-width: 0; }
    .task .body strong { font-family: var(--lbg-font-strong); display: block; }
    .task .body small { color: var(--lbg-grey-600); font-size: var(--lbg-text-sm); }
    .task .chev { width: 12px; }
    .privacy { font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); margin: var(--lbg-space-2) 0 0; }
  </style>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/pass.css">
</head>
<body class="joiner">
<div class="phone">
  <header class="appbar">
    <img class="logo" src="/brand/logos/lbg-logo.svg" alt="Lloyds Banking Group">
    <button class="avatar" id="profile" type="button" aria-label="Your profile. Log out"></button>
  </header>

  <div class="hero">
    <p class="eyebrow">Your joining journey</p>
    <h1 id="hello">Welcome</h1>
    <p id="job"></p>
    <div class="pass" id="pass" aria-label="Your joiner pass" hidden>
      <img class="horse" src="/brand/logos/horse-white.svg" alt="">
      <div class="pass-top"><img src="/brand/logos/lbg-logo-white.svg" alt="Lloyds Banking Group"><span class="chip" id="pass-chip">Pre-boarding</span></div>
      <div class="pass-who">
        <div><div class="nm" id="pass-name"></div><div class="rl" id="pass-role"></div></div>
        <div class="no" id="pass-day" hidden>Day one<b id="pass-date"></b></div>
      </div>
    </div>
    <dl class="facts" id="countdown" aria-label="Your progress" hidden>
      <div id="days-tile"><dt>Days to go</dt><dd id="days">0</dd></div>
      <div><dt>Stages done</dt><dd id="stages">0/0</dd></div>
    </dl>
  </div>

  <section class="jsection journey" id="journey" hidden></section>

  <section class="jsection">
    <h2>Help and reading</h2>
    <button type="button" class="task lbg-card" id="open-assistant">
      <span class="icon icon--ai" aria-hidden="true">Ask</span>
      <span class="body"><strong>Got a question? Ask any time</strong><small>Onboarding assistant · answers from your guides</small></span>
      <img class="chev" src="/brand/icons/chevron-right.svg" alt="">
    </button>
    <a class="task lbg-card" href="/joiner/guides.html">
      <span class="icon"><img src="/brand/icons/list-style-information-rounded-black.svg" alt=""></span>
      <span class="body"><strong>Your guides</strong><small>Checks, pay, your first day and more</small></span>
      <img class="chev" src="/brand/icons/chevron-right.svg" alt="">
    </a>
  </section>

  <section class="jsection">
    <h2>Your people</h2>
    <div id="people"></div>
    <p class="privacy">Each chat is private between you and that person.</p>
  </section>
</div>

<script type="module">
  import { api, logout, initials, daysUntil } from '/js/chat.js';
  import { mountJourney } from '/js/journey-card.js';

  const $ = (id) => document.getElementById(id);
  const make = (tag, props = {}, ...children) => { const n = Object.assign(document.createElement(tag), props); n.append(...children.filter((c) => c != null && c !== false)); return n; };

  const { user: me } = await api('/api/me');
  $('hello').textContent = `Welcome, ${me.name.split(' ')[0]}`;
  $('job').textContent = `Your journey to starting as ${me.jobTitle} in ${me.location}.`;
  $('profile').textContent = initials(me.name);
  $('pass-name').textContent = me.name;
  $('pass-role').textContent = [me.jobTitle, me.location].filter(Boolean).join(' · ');
  if (me.startDate) {
    const [, mm, dd] = me.startDate.split('-');
    $('pass-date').textContent = `${dd} · ${mm}`;
    $('pass-day').hidden = false;
    $('pass-chip').textContent = (daysUntil(me.startDate) ?? 1) > 0 ? 'Pre-boarding' : 'Welcome aboard';
  }
  $('pass').hidden = false;
  $('profile').title = 'Log out';
  $('profile').addEventListener('click', () => { if (confirm(`Log out ${me.name}?`)) logout(); });

  const chat = (query) => { location.href = `/joiner/chat.html?${query}`; };
  $('open-assistant').addEventListener('click', () => chat('assistant=1'));

  // The recruiter and hiring manager are both named on the offer. The manager's chat opens once the unconditional offer is accepted.
  let conversations = [];
  let offer = null;
  function renderPeople() {
    const people = [
      { kind: 'recruiter', label: 'Recruiter', name: offer?.recruiter, locked: 'Your chat opens when your offer is sent' },
      { kind: 'manager', label: 'Hiring manager', name: offer?.hiringManager, locked: 'Your chat opens when you accept your unconditional offer' },
    ];
    $('people').replaceChildren(...people.map((p) => {
      const c = conversations.find((x) => x.kind === p.kind);
      const name = c?.other.name ?? p.name;
      if (!name) return '';
      const face = make('span', { className: `avatar avatar--lg${p.kind === 'manager' ? '' : ' avatar--racing'}`, textContent: initials(name) });
      const info = make('span', { className: 'info' }, make('span', { className: 'role', textContent: p.label }), make('strong', { textContent: name }));
      if (!c) {
        info.append(make('span', { className: 'note', textContent: p.locked }));
        return make('div', { className: 'person lbg-card person--quiet' }, face, info);
      }
      const btn = make('button', { type: 'button', className: 'lbg-btn lbg-btn--secondary' }, 'Message', c.unread ? make('span', { className: 'unread', textContent: c.unread, ariaLabel: `${c.unread} unread` }) : '');
      btn.addEventListener('click', () => chat(`id=${c.id}`));
      return make('div', { className: 'person lbg-card' }, face, info, btn);
    }));
  }
  async function loadPeople() {
    try { ({ conversations } = await api('/api/conversations')); } catch { /* keep what we have */ }
    renderPeople();
  }

  const journey = mountJourney($('journey'), { onOpenChat: (kind) => chat(`kind=${kind}`) });
  async function refreshAll() {
    const j = await journey.refresh();
    if (j) {
      offer = j.offer;
      const done = j.steps.filter((s) => s.state === 'done').length;
      $('stages').replaceChildren(String(done), make('small', { textContent: ` / ${j.steps.length}` }));
      const d = daysUntil(me.startDate);
      $('days').textContent = d;
      $('days-tile').hidden = d == null || d < 0;
      $('countdown').hidden = false;
    }
    await loadPeople();
  }
  await refreshAll();

  // Keep the page live without owning a chat connection: the chat widget has one, so reuse its events.
  document.addEventListener('chat:unread', loadPeople);
  const socketScript = make('script', { src: '/socket.io/socket.io.js' });
  socketScript.onload = () => { const s = window.io(); s.on('journey:updated', refreshAll); s.on('conversations:changed', loadPeople); };
  document.head.append(socketScript);
</script>
<script type="module" src="/js/joiner-shell.js"></script>
</body>
</html>

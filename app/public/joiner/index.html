<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#024731">
  <title>Messages · Joiner companion</title>
  <link rel="icon" href="/brand/logos/favicon.ico">
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/journey.css">
  <style>
    body { background: var(--lbg-grey-100); }
    .phone { max-width: 430px; margin: 0 auto; height: 100dvh; background: var(--lbg-white); display: flex; flex-direction: column; }
    .appbar { display: flex; align-items: center; justify-content: space-between; padding: var(--lbg-space-2) var(--lbg-space-4); }
    .appbar img { height: 28px; display: block; }

    /* People list view */
    .intro { padding: var(--lbg-space-4) var(--lbg-space-4) var(--lbg-space-6); display: flex; align-items: flex-end; gap: var(--lbg-space-4); }
    .intro h1 { font-size: var(--lbg-text-h2); line-height: var(--lbg-lh-h2); margin: 0 0 var(--lbg-space-1); }
    .intro p { margin: 0; font-size: var(--lbg-text-sm); opacity: .9; }
    .countdown { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.2; flex: none; }
    .countdown b { display: block; font-family: var(--lbg-font-heading); font-size: var(--lbg-text-h2); line-height: 1.1; }
    .people-view { flex: 1; overflow-y: auto; padding: var(--lbg-space-6) var(--lbg-space-4); }
    .people-view h2 { font-size: var(--lbg-text-lg); line-height: var(--lbg-lh-lg); margin-bottom: var(--lbg-space-3); }
    .people { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--lbg-space-3); }
    .person {
      display: flex; align-items: center; gap: var(--lbg-space-3); width: 100%; text-align: left; cursor: pointer;
      border: 0; background: var(--lbg-white); border-radius: var(--lbg-radius-lg); box-shadow: var(--lbg-shadow-card);
      padding: var(--lbg-space-4); min-height: 72px;
    }
    .person .info { flex: 1; min-width: 0; }
    .person .role { font-size: 12px; font-family: var(--lbg-font-strong); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--lbg-heritage-green); }
    .person strong { display: block; font-family: var(--lbg-font-strong); }
    .person .preview { display: block; font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .person.has-unread .preview { color: var(--lbg-black); font-family: var(--lbg-font-strong); font-weight: 700; }
    .person .chev { width: 12px; flex: none; }
    .person.unassigned { box-shadow: none; border: 1px dashed var(--lbg-grey-400); cursor: default; }
    .person.unassigned .avatar { background: var(--lbg-grey-200); color: var(--lbg-grey-600); }
    .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--lbg-radius-pill); background: var(--lbg-heritage-green); color: var(--lbg-white); font-size: 12px; font-family: var(--lbg-font-strong); font-weight: 700; display: inline-grid; place-items: center; flex: none; }
    .privacy { font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); margin: var(--lbg-space-4) 0 0; }

    /* Chat view */
    .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chat-head { display: flex; align-items: center; gap: var(--lbg-space-3); padding: var(--lbg-space-2) var(--lbg-space-4) var(--lbg-space-3); }
    .chat-head .back { display: inline-flex; align-items: center; gap: var(--lbg-space-1); padding-left: 0; text-decoration: none; }
    .chat-head .back img { width: 20px; filter: brightness(0) invert(1); }
    .chat-head strong { display: block; font-family: var(--lbg-font-strong); font-size: var(--lbg-text-lg); }
    .chat-head small { font-size: var(--lbg-text-sm); opacity: .9; }
    .chat-head .avatar { background: var(--lbg-white); color: var(--lbg-racing-green); }
    .chat-view .thread { flex: 1; }

    /* Assistant */
    .person.assistant { background: var(--lbg-grey-100); box-shadow: none; border: 1px solid var(--lbg-grey-200); margin-bottom: var(--lbg-space-3); color: inherit; text-decoration: none; }
    .person.assistant + h2 { margin-top: var(--lbg-space-6); }
    .guide-icon { width: 24px; filter: brightness(0) invert(1); }
    .ai-sources a { color: inherit; }
    .avatar--ai { background: var(--lbg-charcoal); font-size: 13px; }
    .ai-note { align-self: center; text-align: center; max-width: 90%; font-size: 12px; color: var(--lbg-grey-600); margin: 0 0 var(--lbg-space-3); }
    .ai-sources { font-size: 12px; color: var(--lbg-grey-600); margin-top: var(--lbg-space-1); padding: 0 var(--lbg-space-1); }
    .ai-handoff { margin-top: var(--lbg-space-2); width: auto; min-height: 40px; padding: var(--lbg-space-1) var(--lbg-space-4); font-size: var(--lbg-text-sm); }
    .ai-handoff-note { font-size: var(--lbg-text-sm); color: var(--lbg-grey-600); margin-top: var(--lbg-space-2); padding: 0 var(--lbg-space-1); }
    .ai-suggestions { display: flex; flex-wrap: wrap; gap: var(--lbg-space-2); justify-content: center; margin-top: var(--lbg-space-2); }
    .ai-suggestions button { border: 1px solid var(--lbg-heritage-green); color: var(--lbg-heritage-green); background: var(--lbg-white); border-radius: var(--lbg-radius-pill); padding: var(--lbg-space-2) var(--lbg-space-3); min-height: 40px; font-size: var(--lbg-text-sm); cursor: pointer; }
    .composer { padding-bottom: calc(var(--lbg-space-3) + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
<div class="phone">
  <div class="proto-strip">Concept prototype · synthetic data only</div>
  <header class="lbg-surface--racing">
    <div class="appbar">
      <img src="/brand/logos/lbg-logo-white.svg" alt="Lloyds Banking Group">
      <button class="link-btn" id="logout" type="button">Log out</button>
    </div>
    <div class="intro" id="intro">
      <div>
        <h1 id="hello">Your people</h1>
        <p id="job"></p>
      </div>
      <div class="countdown" id="countdown" hidden><b></b>days to go</div>
    </div>
    <div class="chat-head" id="chat-head" hidden>
      <button class="link-btn back" id="back" type="button" aria-label="Back to your people"><img src="/brand/icons/arrow-left.svg" alt=""></button>
      <span class="avatar avatar--lg" id="other-avatar"></span>
      <div><strong id="other-name"></strong><small id="other-role"></small></div>
    </div>
  </header>
  <div class="conn-banner" id="conn" hidden>Reconnecting…</div>

  <div class="people-view" id="people-view">
    <section class="journey" id="journey" hidden></section>
    <button type="button" class="person assistant" id="open-assistant">
      <span class="avatar avatar--lg avatar--ai" aria-hidden="true">Ask</span>
      <span class="info">
        <span class="role">Onboarding assistant</span>
        <strong>Got a question? Ask any time</strong>
        <span class="preview">Answers from your onboarding guides, day or night</span>
      </span>
      <img class="chev" src="/brand/icons/chevron-right.svg" alt="">
    </button>
    <a class="person assistant" href="/joiner/guides.html">
      <span class="avatar avatar--lg avatar--racing" aria-hidden="true"><img src="/brand/icons/list-style-information-rounded-black.svg" alt="" class="guide-icon"></span>
      <span class="info">
        <span class="role">Your guides</span>
        <strong>Read up before you start</strong>
        <span class="preview" id="guides-preview">Checks, pay, your first day and more</span>
      </span>
      <img class="chev" src="/brand/icons/chevron-right.svg" alt="">
    </a>
    <h2>Your people</h2>
    <ul class="people" id="people"></ul>
    <p class="privacy">Each chat is private between you and that person.</p>
  </div>

  <div class="chat-view" id="chat-view" hidden>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="typing" id="typing" hidden></div>
    <p class="composer-error" id="send-error" role="alert" hidden></p>
    <form class="composer" id="composer">
      <textarea id="message" rows="1" maxlength="2000" aria-label="Message"></textarea>
      <button class="lbg-btn lbg-btn--primary" type="submit">Send</button>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { api, logout, initials, fmtShort, daysUntil, Thread, bindComposer, typingIndicator, emitWithAck } from '/js/chat.js';
  import { mountJourney } from '/js/journey-card.js';

  const ROLE_ORDER = ['recruiter', 'manager'];
  const ROLE_LABELS = { manager: 'Hiring manager', recruiter: 'Recruiter' };
  const ROLE_BLURBS = {
    manager: "You'll be connected with your hiring manager once you accept your unconditional offer.",
    recruiter: 'Your recruiter will be in touch soon.',
  };

  const $ = (id) => document.getElementById(id);
  const make = (tag, props = {}, ...children) => { const n = Object.assign(document.createElement(tag), props); n.append(...children); return n; };
  $('logout').addEventListener('click', logout);

  const { user: me } = await api('/api/me');
  $('hello').textContent = `Hi ${me.name.split(' ')[0]}`;
  $('job').textContent = `${me.jobTitle} · ${me.location}`;
  const days = daysUntil(me.startDate);
  if (days != null && days >= 0) { $('countdown').querySelector('b').textContent = days; $('countdown').hidden = false; }

  const thread = new Thread($('thread'), me.id);
  const showTyping = typingIndicator($('typing'));
  let conversations = [];
  let activeId = null;

  function renderPeople() {
    $('people').replaceChildren(...ROLE_ORDER.map((role) => {
      const c = conversations.find((x) => x.kind === role);
      if (!c) {
        return make('li', {}, make('div', { className: 'person unassigned' },
          make('span', { className: 'avatar avatar--lg', textContent: '?' }),
          make('span', { className: 'info' },
            make('span', { className: 'role', textContent: ROLE_LABELS[role] }),
            make('strong', { textContent: 'Not assigned yet' }),
            make('span', { className: 'preview', textContent: ROLE_BLURBS[role] }))));
      }
      const btn = make('button', { type: 'button', className: `person${c.unread ? ' has-unread' : ''}` },
        make('span', { className: `avatar avatar--lg${role === 'manager' ? '' : ' avatar--racing'}`, textContent: initials(c.other.name) }),
        make('span', { className: 'info' },
          make('span', { className: 'role', textContent: ROLE_LABELS[role] }),
          make('strong', { textContent: c.other.name }),
          make('span', { className: 'preview', textContent: c.lastMessage ? `${c.lastMessage.senderId === me.id ? 'You: ' : ''}${c.lastMessage.body}` : 'Say hello' })),
        c.unread ? make('span', { className: 'badge', textContent: c.unread, ariaLabel: `${c.unread} unread` }) : '',
        make('img', { className: 'chev', src: '/brand/icons/chevron-right.svg', alt: '' }));
      btn.addEventListener('click', () => open(c.id));
      return make('li', {}, btn);
    }));
    const total = conversations.reduce((n, c) => n + c.unread, 0);
    document.title = `${total ? `(${total}) ` : ''}Messages · Joiner companion`;
  }

  async function loadConversations() {
    ({ conversations } = await api('/api/conversations'));
    renderPeople();
  }

  const markRead = () => {
    if (activeId == null || activeId === ASSISTANT || document.visibilityState !== 'visible') return;
    const c = conversations.find((x) => x.id === activeId);
    if (c?.unread) { c.unread = 0; renderPeople(); }
    api(`/api/conversations/${activeId}/read`, { method: 'POST' }).catch(() => {});
  };

  async function open(id) {
    activeId = id;
    const c = conversations.find((x) => x.id === id);
    $('intro').hidden = true; $('people-view').hidden = true;
    $('chat-head').hidden = false; $('chat-view').hidden = false;
    $('typing').hidden = true; $('send-error').hidden = true;
    $('other-name').textContent = c.other.name;
    $('other-avatar').textContent = initials(c.other.name);
    $('other-role').textContent = `${ROLE_LABELS[c.kind]} · ${c.other.jobTitle}`;
    $('message').placeholder = `Message ${c.other.name.split(' ')[0]}`;
    thread.set([]);
    const { messages } = await api(`/api/conversations/${id}/messages`);
    if (activeId !== id) return;
    thread.set(messages);
    thread.scrollToEnd();
    markRead();
  }

  // ---------- onboarding assistant ----------
  const ASSISTANT = 'assistant';
  const SUGGESTIONS = ['How long do background checks take?', 'What should I bring on my first day?', 'When will I get paid?', 'Can I move my start date?'];
  let aiTurns = [];      // [{ question, answer?, sources, handoff, error? }]
  let aiLoaded = false;

  function renderAssistant() {
    const list = $('thread');
    const nodes = [make('p', { className: 'ai-note', textContent: 'Answers come from your onboarding documents. The assistant can make mistakes, so check anything important with your recruiter.' })];
    if (!aiTurns.length) {
      const chips = SUGGESTIONS.map((s) => {
        const b = make('button', { type: 'button', textContent: s });
        b.addEventListener('click', () => askAssistant(s));
        return b;
      });
      nodes.push(make('div', { className: 'msg msg--theirs' }, make('div', { className: 'bubble', textContent: `Hi ${me.name.split(' ')[0]}! Ask me anything about joining: checks, pay, your first day, equipment or training.` })),
        make('div', { className: 'ai-suggestions' }, ...chips));
    }
    for (const t of aiTurns) {
      nodes.push(make('div', { className: 'msg msg--mine' }, make('div', { className: 'bubble', textContent: t.question })));
      if (t.answer == null && !t.error) continue;
      const row = make('div', { className: 'msg msg--theirs' }, make('div', { className: 'bubble', textContent: t.error ?? t.answer }));
      if (t.sources?.length) {
        const links = t.sources.flatMap((s, n) => [n ? ' · ' : '', make('a', { href: `/joiner/guides.html?from=assistant#${encodeURIComponent(s.id)}`, textContent: s.title })]);
        row.append(make('div', { className: 'ai-sources' }, 'From: ', ...links));
      }
      if (t.handoff && t.handoff !== 'none') {
        const c = conversations.find((x) => x.kind === t.handoff);
        if (c) {
          const b = make('button', { type: 'button', className: 'lbg-btn lbg-btn--secondary ai-handoff', textContent: `Ask ${c.other.name.split(' ')[0]}, your ${ROLE_LABELS[t.handoff].toLowerCase()}` });
          b.addEventListener('click', async () => { await open(c.id); const input = $('message'); input.value = t.question; input.dispatchEvent(new Event('input')); input.focus(); });
          row.append(b);
        } else {
          row.append(make('div', { className: 'ai-handoff-note', textContent: `You don't have a ${ROLE_LABELS[t.handoff].toLowerCase()} yet. Your recruiter can help in the meantime.` }));
        }
      }
      nodes.push(row);
    }
    list.replaceChildren(...nodes);
    list.scrollTop = list.scrollHeight;
  }

  async function openAssistant() {
    activeId = ASSISTANT;
    $('intro').hidden = true; $('people-view').hidden = true;
    $('chat-head').hidden = false; $('chat-view').hidden = false;
    $('typing').hidden = true; $('send-error').hidden = true;
    $('other-name').textContent = 'Onboarding assistant';
    $('other-avatar').textContent = 'Ask';
    $('other-role').textContent = 'Answers from your onboarding guides';
    $('message').placeholder = 'Ask a question';
    $('thread').replaceChildren(); // never leave the previous person's chat on screen
    if (!aiLoaded) {
      try {
        const { history } = await api('/api/assistant');
        aiTurns = history; aiLoaded = true;
      } catch (err) {
        if (activeId !== ASSISTANT) return;
        $('thread').replaceChildren(make('p', { className: 'thread-empty', textContent: `The assistant isn't available right now (${err.message}). Try again shortly, or message your recruiter.` }));
        return;
      }
    }
    if (activeId === ASSISTANT) renderAssistant();
  }
  $('open-assistant').addEventListener('click', openAssistant);
  if (location.hash === '#assistant') { history.replaceState(null, '', location.pathname); openAssistant(); }

  async function askAssistant(question) {
    const turn = { question };
    aiTurns.push(turn);
    renderAssistant();
    $('typing').textContent = 'The assistant is looking through your documents…';
    $('typing').hidden = false;
    try {
      Object.assign(turn, await api('/api/assistant', { method: 'POST', body: JSON.stringify({ question }) }));
    } catch (err) {
      turn.error = `Sorry, I couldn't answer that just now (${err.message}). Try again, or ask your recruiter.`;
    } finally {
      $('typing').hidden = true;
      if (activeId === ASSISTANT) renderAssistant();
    }
  }

  function close() {
    activeId = null;
    $('chat-head').hidden = true; $('chat-view').hidden = true;
    $('intro').hidden = false; $('people-view').hidden = false;
    renderPeople();
  }
  $('back').addEventListener('click', close);

  function onMessage(m) {
    const c = conversations.find((x) => x.id === m.conversationId);
    if (!c) return loadConversations();
    c.lastMessage = { body: m.body, createdAt: m.createdAt, senderId: m.senderId };
    if (m.conversationId === activeId) {
      thread.add(m);
      if (m.senderId !== me.id) { $('typing').hidden = true; markRead(); }
    } else if (m.senderId !== me.id) {
      c.unread += 1;
    }
    renderPeople();
  }

  // Journey progress (offer to Day 30) and the next step, kept live.
  const journey = mountJourney($('journey'), {
    onOpenChat: (kind) => { const c = conversations.find((x) => x.kind === kind); if (c) open(c.id); },
  });

  const socket = io();
  socket.on('journey:updated', () => { journey.refresh(); loadConversations(); });
  socket.on('conversations:changed', loadConversations);
  socket.on('connect', async () => {
    $('conn').hidden = true;
    await loadConversations();
    if (activeId === ASSISTANT) renderAssistant();
    else if (activeId != null) open(activeId);
  });
  socket.on('disconnect', () => { $('conn').hidden = false; });
  socket.on('connect_error', (err) => { if (err.message === 'unauthorised') location.href = '/login.html'; else $('conn').hidden = false; });
  socket.on('message:new', onMessage);
  socket.on('conversation:read', ({ conversationId, readerId, at }) => { if (conversationId === activeId && readerId !== me.id) thread.markReadBy(readerId, at); });
  socket.on('typing', ({ conversationId, name }) => { if (conversationId === activeId) showTyping(name); });
  document.addEventListener('visibilitychange', markRead);

  bindComposer($('composer'), {
    onTyping: () => activeId != null && activeId !== ASSISTANT && socket.emit('typing', { conversationId: activeId }),
    onSend: async (body) => {
      $('send-error').hidden = true;
      if (activeId === ASSISTANT) { askAssistant(body); return; }
      try {
        const { message } = await emitWithAck(socket, 'message:send', { conversationId: activeId, body });
        onMessage(message);
        thread.scrollToEnd();
      } catch (err) {
        $('send-error').textContent = err.message;
        $('send-error').hidden = false;
        throw err;
      }
    },
  });
</script>
</body>
</html>
